# Batch-inference config for predict.py / submit_predict.sh (NetCDF + GOES data).
#
#   ./submit_predict.sh configs/predict_example.yaml                       # SLURM job
#   ./submit_predict.sh configs/predict_example.yaml end_time=2023-06-30T23:00 --dry-run
#   python predict.py configs/predict_example.yaml                         # directly, on a GPU node
#
# See docs/PREDICTING.md for every option. Outputs go to predictions/<name>/.

name: goes_lowres_test
description: "goes_lowres best checkpoint on 2023 test data"

# --- model: must match the training run ---
config_filepath: ./config/params_lowres_ges_goes.yaml
checkpoint: training_runs/goes_lowres/best_ckpt.tar
params: {}               # copy any architecture/data overrides the training run used (arch, depths, train_obs_source, ...)

# --- analysis times (inclusive) ---
start_time: 2023-06-13T00:00
end_time: 2023-06-13T23:00
hour_step: 1

# --- data ---
data_dir: null           # dir of YYYY-MM-DD_HH.nc files; null = test_data_path from config_filepath
stats_path: ./data_preparation_ges/stats_ges.csv

# --- what to run and save ---
modes: [all_obs, heldout, no_obs]
heldout_ratio: null      # null = hold_out_obs_ratio from config_filepath (0.1)
save_fields: true        # predictions/<name>/fields/<YYYY-MM-DD_HH>.<format>
field_formats: [nc]      # nc (NetCDF) and/or pt (torch tensors), e.g. [nc, pt]
plot_channels: [t]       # error map + scatter per time; [] for none
skip_existing: false     # true: resume, skipping times already in metrics_per_time.csv

# --- SLURM job (submit_predict.sh only) ---
slurm:
  account: gpu-emc-ai
  partition: u1-h100
  qos: gpu
  cpus_per_task: 8
  mem: 64G
  time: "02:00:00"
  env_setup:
    - module load python
    - source /scratch3/NCEPDEV/da/Xin.C.Jin/miniconda/etc/profile.d/conda.sh
    - conda activate test_adaf_rtma
  env_vars:
    OMP_NUM_THREADS: 4
