# ADAF-RTMA configuration for the Ocelot3 Parquet data source (see docs/OCELOT3_ADAPTER.md)
# Copy of params_lowres_ges_goes.yaml with the data section swapped for Ocelot3.
# img_size_x/y and in_chans are overridden at runtime by train_ges_goes.py from the Ocelot3 static grid.

base_config: &BASE_CONFIG

  # ============================================================================
  # TRAINING PARAMETERS
  # ============================================================================
  max_epochs: 999
  batch_size: 2
  num_data_workers: 5
  accum_steps: 1
  save_checkpoint: True
  save_model_freq: 1
  valid_frequency: 1
  valid_max_files: 1200
  heldout_metric_source: metar
  optimizer_type: "AdamW"
  weight_decay: 0.01
  scheduler: "ReduceLROnPlateau"
  scheduler_patience: 10
  lr_reduce_factor: 0.5
  lr: 7E-4
  warmup_iters: 2000
  grad_clip: 1.0
  local_rank: -1
  world_rank: -1

  # ============================================================================
  # DDP/OPTIMIZATION PARAMETERS
  # ============================================================================
  prefetch_factor: 4
  non_blocking: True
  ddp_find_unused_parameters: False
  ddp_static_graph: False
  ddp_broadcast_buffers: False
  tf32: True
  amp_dtype: "bfloat16"
  channels_last: True
  compile_model: True
  compile_loss: False
  localsgd_h: 0
  localsgd_warmup: 0
  sync_epoch_timing: True
  train_sample_fraction: 1.0

  # ============================================================================
  # DATA PATHS AND SPECIFICATIONS
  # ============================================================================
  data_source: "ocelot3" # "netcdf" | "ocelot3"
  ocelot3_data_dir: "/scratch3/NCEPDEV/stmp/Xin.C.Jin/data/ocelot/data_v6/urma_ok" # root containing the *.parquet tables
  ocelot3_static_data_dir: "/scratch3/NCEPDEV/da/Xin.C.Jin/my_data/urma_ok" # urma2p5_terrain.npy / urma2p5_slmask_nolakes.npz
  ocelot3_delta_time: 1 # hours between bins
  ocelot3_pad_multiple: None # None = auto (1 for arch lowres, patch_size*window_size for flat)
  ocelot3_train_start_date: "2022-02-01" # start/end must be in the same year
  ocelot3_train_end_date: "2022-02-20"
  ocelot3_valid_start_date: "2022-02-21"
  ocelot3_valid_end_date: "2022-02-28"
  checkpoint_path: "./checkpoint"
  best_checkpoint_path: "./best_checkpoint"
  resume_checkpoint_path: None #To be provided only when resuming from checkpoint. Must include best_ckpt.tar or ckpt.tar at the end of the path!

  # Input/output variables and channels
  # Only target_vars is read on this path: it sets the channel order (and must use t/q/u10/v10 names).
  # No satellite -- Ocelot3 has no satellite source.
  inp_sat_vars: []
  target_vars: ["q", "t", "u10", "v10"]

  # Data processing
  obs_time_window: 3

  # ============================================================================
  # MODEL ARCHITECTURE -- 1/4-res Swin body, Tier M
  # ============================================================================
  upscale: 1
  in_chans: 17 # overridden at runtime: 4 background + 4*obs_time_window obs + 1 topo (no satellite)
  out_chans: 4
  img_size_x: 331 # overridden at runtime from ocelot3_static_data_dir (urma_ok native grid is 171 x 331)
  img_size_y: 171
  arch: "lowres"
  multiscale: False
  downscale: 4
  stem_dims: [96, 128]
  body_dim: 192
  depths: [4, 4]
  num_heads: [6, 6]
  window_size: 12
  stem_norm: "layer"
  layer_scale_init: 1.0E-4
  head_dims: [96, 96]
  num_feat: 96
  patch_size: 1
  drop_rate: 0.1
  drop_path_rate: 0.1
  attn_drop_rate: 0.1
  ape: False
  patch_norm: True
  use_checkpoint: False
  resi_connection: "1conv"
  qkv_bias: True
  qk_scale: None
  img_range: 1.
  embed_dim: 64
  mlp_ratio: 2
  upsampler: "pixelshuffle"

  # ============================================================================
  # TRAINING SPECIFICS
  # ============================================================================
  target: "analysis_obs"
  hold_out_obs: True
  hold_out_obs_ratio: 0.1
  hold_out_ratio_min: 0.05
  hold_out_ratio_max: 0.30
  hold_out_block_prob: 0.3
  hold_out_block_min: 64
  hold_out_block_max: 192
  heldout_loss_weight: 0.3
  heldout_loss_source: all
  train_obs_source: metar
  learn_residual: True
  gpu_assemble: True
  obs_mask_seed: 1234
  seed: 0
  loss_channel_weights: [1.0, 1.0, 1.0, 1.0]
  resuming: False
  enable_amp: True
  log_to_screen: True

  # ============================================================================
  # NORMALIZATION
  # ============================================================================
  # Unused on the Ocelot3 path: data arrive z-scored by orca_common (FEATURE_STATS)
  norm_type: "variable_wise_ignore_extreme"
  normalization: "minmax_ignore_extreme"


# ============================================================================
# NAMED CONFIGURATION SECTIONS
# ============================================================================

EncDec:
  <<: *BASE_CONFIG